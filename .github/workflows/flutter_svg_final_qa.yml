name: flutter_svg final QA

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Repository containing the combined changes
        required: true
        default: Otzaria/packages
        type: string
      target_ref:
        description: Exact commit SHA or branch to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: source/third_party/packages/flutter_svg
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
          path: source
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Full Flutter test suite
        run: flutter test
      - name: Product VM isolate transfers
        if: ${{ hashFiles('source/third_party/packages/flutter_svg/test/isolate_safe_loaders_test.dart') != '' }}
        run: flutter test --dart-define=dart.vm.product=true test/isolate_safe_loaders_test.dart
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
